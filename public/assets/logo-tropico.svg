<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8B319" />
      <stop offset="100%" stop-color="#F29E0B" />
    </linearGradient>
  </defs>
  <!-- Background Yellow/Gold -->
  <rect width="500" height="500" rx="32" fill="url(#logoBg)"/>
  
  <!-- Outer Diamond Badge -->
  <rect x="200" y="105" width="100" height="100" rx="10" transform="rotate(45 250 155)" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Inner Diamond Badge (overlapping layer like original) -->
  <rect x="208" y="113" width="84" height="84" rx="6" transform="rotate(45 250 155)" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" opacity="0.9"/>
  
  <!-- Number 56 inside diamond -->
  <text x="250" y="167" font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">56</text>
  
  <!-- Accent mark over O in TRÓPICO -->
  <path d="M 195 245 L 210 230" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  
  <!-- TRÓPICO Typography -->
  <text x="250" y="315" font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="70" font-weight="300" fill="#FFFFFF" text-anchor="middle" letter-spacing="12">TRÓPICO</text>
  
  <!-- Subtitle / Brand Signature -->
  <text x="250" y="365" font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="6" opacity="0.95">RESTAURANTE</text>
</svg>
